[Definition]

actionstart =
actionstop =
actioncheck =

actionban = token=$(awk -F= '$1 == "CLOUDFLARE_API_TOKEN" { print substr($0, index($0, "=") + 1); exit }' /etc/vaultwarden/cloudflare.env); [ -n "$token" ] || exit 1; printf 'header = "Authorization: Bearer %s"\nheader = "Content-Type: application/json"\n' "$token" | curl --config - -fsS -X POST "<_cf_api_url>" \
              --data '{"mode":"<cfmode>","configuration":{"target":"<cftarget>","value":"<ip>"},"notes":"<notes>"}'

actionunban = token=$(awk -F= '$1 == "CLOUDFLARE_API_TOKEN" { print substr($0, index($0, "=") + 1); exit }' /etc/vaultwarden/cloudflare.env); [ -n "$token" ] || exit 1; id=$(printf 'header = "Authorization: Bearer %s"\nheader = "Content-Type: application/json"\n' "$token" | curl --config - -fsS -G -X GET "<_cf_api_url>" \
              --data-urlencode "mode=<cfmode>" \
              --data-urlencode "notes=<notes>" \
              --data-urlencode "configuration.target=<cftarget>" \
              --data-urlencode "configuration.value=<ip>" | jq -r '.result[0].id // empty')
              if [ -z "$id" ]; then echo "<name>: id for <ip> cannot be found using target <cftarget>"; exit 0; fi
              printf 'header = "Authorization: Bearer %s"\nheader = "Content-Type: application/json"\n' "$token" | curl --config - -fsS -X DELETE "<_cf_api_url>/$id"

_cf_api_url = https://api.cloudflare.com/client/v4/zones/<cfzone>/firewall/access_rules/rules
[Init]

cfzone =
cftarget = ip
cfmode = block
notes = Fail2Ban <name>

[Init?family=inet6]
cftarget = ip6
